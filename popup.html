<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PolyMakr</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark">P</div>
        <div>
          <h1>PolyMakr</h1>
          <p>Regras de preço para Polymarket</p>
        </div>
      </header>
      <p class="notice">Abra um mercado no Polymarket para acompanhar os preços e configurar regras no painel da página.</p>
      <button id="open-panel" type="button">Abrir painel na página</button>
      <p id="status" role="status"></p>
      <p class="footnote">As regras ficam salvas neste navegador. O modo de ordem limite pode clicar em Trade automaticamente.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
